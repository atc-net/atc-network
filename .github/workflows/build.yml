name: "Build and test"

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'hotfix/**'
    tags-ignore:
      - '**'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  dotnet-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 🔁 Restore packages
        run: dotnet restore Atc.Network.sln

      - name: 🛠️ Build solution
        run: dotnet build Atc.Network.sln -c Release --no-restore

  dotnet-test:
    needs: dotnet-build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: 🛒 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: ⚙️ Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: 🔁 Restore packages
        run: dotnet restore Atc.Network.sln

      - name: 🛠️ Build solution
        run: dotnet build Atc.Network.sln -c Release --no-restore /p:UseSourceLink=true

      # Integration tests (Category=Integration) need external servers and are not run in CI.
      # A test run that stops making progress writes a hang dump that names the running tests, and fails.
      - name: 🧪 Run unit tests with code coverage
        run: dotnet test --solution Atc.Network.sln -c Release --no-build --coverage --coverage-output-format cobertura --filter-query "/[category!=integration]" --hangdump --hangdump-timeout 10m --hangdump-type Mini

      - name: 📤 Upload hang dumps
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hangdump-${{ matrix.os }}
          path: |
            **/TestResults/**/*.dmp
            **/TestResults/**/*hangdump*
          if-no-files-found: ignore
          retention-days: 7

      - name: 📤 Upload coverage reports as workflow artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-cobertura-${{ matrix.os }}
          path: '**/TestResults/**/*.cobertura.xml'
          if-no-files-found: warn
          retention-days: 14
